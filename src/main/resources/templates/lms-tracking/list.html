<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{layouts/main}">
<head>
    <title>📱 LMS 문자 발송 추적</title>
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}"/>
    <meta name="_csrf" th:unless="${_csrf}" content=""/>
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}"/>
    <meta name="_csrf_header" th:unless="${_csrf}" content="X-CSRF-TOKEN"/>
    
    <style>
        /* 🎨 CSS 변수 정의 */
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #dbeafe;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --info: #06b6d4;
            --info-light: #cffafe;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --radius: 0.5rem;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --bg-card: #ffffff;
            --bg-hover: #f9fafb;
        }

        /* 헤더 정렬 스타일 */
        #kt_app_toolbar {
            padding: 0.75rem 0 !important;
            min-height: auto !important;
        }
        
        #kt_app_toolbar_container {
            padding-left: 1rem !important;
            margin-left: 0 !important;
        }
        
        .page-title {
            margin: 0 !important;
            padding: 0 !important;
            margin-left: 0 !important;
        }
        
        .page-heading {
            margin: 0 !important;
        }
        
        .breadcrumb {
            margin: 0 !important;
            padding-top: 0.25rem !important;
        }
        
        #kt_app_content {
            padding-top: 2.5rem !important;
            margin-top: 0 !important;
        }
        
        #kt_app_content_container.app-container {
            padding-left: 1rem !important;
            padding-right: 1rem !important;
        }

        /* 📊 통계 대시보드 스타일 */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-box:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .stat-box.success { border-left: 4px solid var(--success); }
        .stat-box.primary { border-left: 4px solid var(--primary); }
        .stat-box.warning { border-left: 4px solid var(--warning); }
        .stat-box.danger { border-left: 4px solid var(--danger); }
        .stat-box.info { border-left: 4px solid var(--info); }

        .card-content {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .stat-box h3 {
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 600;
            margin: 0 0 0.75rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .value {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0.5rem 0;
            line-height: 1.2;
        }

        .description {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-top: auto;
        }

        .percentage {
            font-size: 0.875rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            margin-left: 0.5rem;
        }

        .percentage.positive {
            background: var(--success-light);
            color: var(--success);
        }

        .percentage.negative {
            background: var(--danger-light);
            color: var(--danger);
        }

        /* 🔍 검색 필터 스타일 */
        .search-filter {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
        }

        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .form-control {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .btn-secondary:hover {
            background: var(--gray-200);
        }

        /* 🗂️ 테이블 스타일 */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .table-header {
            background: var(--gray-50);
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: between;
            align-items: center;
        }

        .table-header h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th,
        .table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--gray-100);
            font-size: 0.875rem;
        }

        .table th {
            background: var(--gray-50);
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .table tr:hover {
            background: var(--bg-hover);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .badge.success {
            background: var(--success-light);
            color: var(--success);
        }

        .badge.warning {
            background: var(--warning-light);
            color: var(--warning);
        }

        .badge.danger {
            background: var(--danger-light);
            color: var(--danger);
        }

        .badge.info {
            background: var(--info-light);
            color: var(--info);
        }

        /* 🔗 링크 스타일 */
        .link-button {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .link-button:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* 📱 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: var(--bg-card);
            margin: 5% auto;
            padding: 0;
            border-radius: var(--radius);
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            background: var(--gray-50);
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h4 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .close {
            color: var(--text-muted);
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 1.5rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        /* 📊 차트 컨테이너 */
        .chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
        }

        .chart-header {
            margin-bottom: 1rem;
        }

        .chart-header h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* 📱 반응형 */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .filter-row {
                grid-template-columns: 1fr;
            }
            
            .modal-content {
                width: 95%;
                margin: 2% auto;
            }
        }

        /* 로딩 스피너 */
        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .spinner {
            border: 2px solid var(--gray-200);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<div layout:fragment="content">
    <!--begin::Content wrapper-->
    <div class="d-flex flex-column flex-column-fluid">
        <!--begin::Toolbar-->
        <div id="kt_app_toolbar" class="app-toolbar py-3 py-lg-6">
            <div id="kt_app_toolbar_container" class="app-container container-fluid d-flex flex-stack">
                <div class="page-title d-flex flex-column justify-content-center flex-wrap me-3">
                    <h1 class="page-heading d-flex text-dark fw-bold fs-3 flex-column justify-content-center my-0">
                        📱 LMS 문자 발송 추적 시스템
                    </h1>
                    <ul class="breadcrumb breadcrumb-separatorless fw-semibold fs-7 my-0 pt-1">
                        <li class="breadcrumb-item text-muted">
                            <a href="/" class="text-muted text-hover-primary">홈</a>
                        </li>
                        <li class="breadcrumb-item">
                            <span class="bullet bg-gray-400 w-5px h-2px"></span>
                        </li>
                        <li class="breadcrumb-item text-muted">LMS 추적</li>
                    </ul>
                </div>
            </div>
        </div>
        <!--end::Toolbar-->

        <!--begin::Content-->
        <div id="kt_app_content" class="app-content flex-column-fluid">
            <div id="kt_app_content_container" class="app-container container-fluid">

                <!-- 📊 통계 대시보드 -->
                <div class="dashboard">
                    <!-- 총 발송 건수 -->
                    <div class="stat-box primary">
                        <div class="card-content">
                            <h3>📨 총 발송 건수</h3>
                            <div class="value" id="totalSent">0</div>
                            <div class="description">기간 내 전체 문자 발송</div>
                        </div>
                    </div>

                    <!-- 재연락 현황 -->
                    <div class="stat-box success">
                        <div class="card-content">
                            <h3>📞 재연락 현황</h3>
                            <div class="value">
                                <span id="recontacted">0</span>
                                <span class="percentage positive" id="recontactRate">0%</span>
                            </div>
                            <div class="description">발송 후 재연락 시도</div>
                        </div>
                    </div>

                    <!-- 통화 성공률 -->
                    <div class="stat-box info">
                        <div class="card-content">
                            <h3>✅ 통화 성공률</h3>
                            <div class="value">
                                <span id="callSuccess">0</span>
                                <span class="percentage positive" id="callSuccessRate">0%</span>
                            </div>
                            <div class="description">재연락 중 통화 성공</div>
                        </div>
                    </div>

                    <!-- 평균 응답시간 -->
                    <div class="stat-box warning">
                        <div class="card-content">
                            <h3>⏱️ 평균 응답시간</h3>
                            <div class="value">
                                <span id="avgResponseTime">0.00</span>
                                <small style="font-size: 0.875rem; color: var(--text-secondary);">분</small>
                            </div>
                            <div class="description">문자 → 재연락까지</div>
                        </div>
                    </div>
                </div>

                <!-- 🔍 검색 필터 -->
                <div class="search-filter">
                    <div class="filter-row">
                        <div class="form-group">
                            <label for="startDate">시작일</label>
                            <input type="date" id="startDate" class="form-control" th:value="${startDate}">
                        </div>
                        
                        <div class="form-group">
                            <label for="endDate">종료일</label>
                            <input type="date" id="endDate" class="form-control" th:value="${endDate}">
                        </div>
                        
                        <div class="form-group">
                            <label for="phoneFilter">전화번호</label>
                            <input type="text" id="phoneFilter" class="form-control" placeholder="010-0000-0000">
                        </div>
                        
                        <div class="form-group">
                            <label for="statusFilter">발송상태</label>
                            <select id="statusFilter" class="form-control">
                                <option value="">전체</option>
                                <option value="SENT">발송완료</option>
                                <option value="PENDING">대기중</option>
                                <option value="FAILED">실패</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <button id="searchBtn" class="btn btn-primary">
                                🔍 조회
                            </button>
                        </div>
                        
                        <div class="form-group">
                            <button id="refreshBtn" class="btn btn-secondary">
                                🔄 새로고침
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 🗂️ LMS 발송 내역 테이블 -->
                <div class="table-container">
                    <div class="table-header">
                        <h3>📱 LMS 발송 내역</h3>
                        <div class="loading">
                            <div class="spinner"></div>
                            데이터를 불러오는 중...
                        </div>
                    </div>
                    
                    <table class="table">
                        <thead>
                            <tr>
                                <th>발송일시</th>
                                <th>수신번호</th>
                                <th>제목</th>
                                <th>메시지 내용</th>
                                <th>발송상태</th>
                                <th>후속연락</th>
                                <th>상세보기</th>
                            </tr>
                        </thead>
                        <tbody id="lmsTableBody">
                            <!-- 동적으로 생성됨 -->
                        </tbody>
                    </table>
                </div>

                <!-- 📄 페이지네이션 -->
                <div id="pagination" class="d-flex justify-content-center mt-4">
                    <!-- 동적으로 생성됨 -->
                </div>

            </div>
        </div>
        <!--end::Content-->
    </div>
    <!--end::Content wrapper-->

    <!-- 📱 통화 내역 상세 모달 -->
    <div id="callHistoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h4>📞 후속 통화 내역</h4>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <div id="callHistoryContent">
                    <!-- 동적으로 생성됨 -->
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script th:inline="javascript">
        // CSRF 토큰을 전역 변수로 설정
        window.csrfToken = /*[[${_csrf != null ? _csrf.token : ''}]]*/ '';
        window.csrfHeader = /*[[${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}]]*/ 'X-CSRF-TOKEN';
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 DOM이 준비되었습니다.');
            console.log('🔍 jQuery 버전:', $.fn.jquery);
            console.log('🎯 조회 버튼 존재:', $('#searchBtn').length > 0);
            console.log('🎯 새로고침 버튼 존재:', $('#refreshBtn').length > 0);
            
            // 초기 데이터 로딩
            loadStatistics();
            loadLmsList();
            
            // 검색 버튼 클릭
            $('#searchBtn').on('click', function() {
                console.log('🔍 조회 버튼 클릭됨');
                loadLmsList();
                loadStatistics();
            });
            console.log('✅ 조회 버튼 이벤트 핸들러 등록됨');
            
            // 새로고침 버튼 클릭
            $('#refreshBtn').on('click', function() {
                console.log('🔄 새로고침 버튼 클릭됨');
                loadLmsList();
                loadStatistics();
            });
            console.log('✅ 새로고침 버튼 이벤트 핸들러 등록됨');
            
            // 엔터키 검색
            $('.form-control').on('keypress', function(e) {
                if (e.which == 13) {
                    console.log('⌨️ 엔터키 눌림');
                    loadLmsList();
                    loadStatistics();
                }
            });
            
            // 모달 닫기
            $('.close').on('click', function() {
                $('#callHistoryModal').hide();
            });
            
            // 모달 외부 클릭시 닫기
            $(window).on('click', function(event) {
                if (event.target.id === 'callHistoryModal') {
                    $('#callHistoryModal').hide();
                }
            });
        });

// 통계 로딩 상태 관리
let isLoadingStats = false;

// 통계 데이터 로딩 (중복 호출 방지 + 로딩 인디케이터)
function loadStatistics() {
    // 이미 로딩 중이면 중복 실행 방지
    if (isLoadingStats) {
        console.log('⏳ 통계 로딩이 이미 진행 중입니다.');
        return;
    }
    
    console.log('📊 통계 데이터 로딩 시작');
    isLoadingStats = true;
    
    // 로딩 인디케이터 표시
    showStatsLoading();
    
    const startDate = $('#startDate').val();
    const endDate = $('#endDate').val();
    const phoneFilter = $('#phoneFilter').val();
    const statusFilter = $('#statusFilter').val();
    
    console.log('📈 통계 검색 조건:', { startDate, endDate, phoneFilter, statusFilter });
    const loadStartTime = Date.now();
    
    $.ajax({
        url: '/lms-tracking/api/statistics',
        method: 'GET',
        headers: {
            'X-CSRF-TOKEN': window.csrfToken
        },
        data: {
            startDate: startDate,
            endDate: endDate,
            phone: phoneFilter,
            status: statusFilter
        },
        success: function(response) {
            const loadTime = Date.now() - loadStartTime;
            console.log(`📊 통계 조회 성공 (${loadTime}ms):`, response);
            
            if (response.success) {
                const stats = response.data;
                $('#totalSent').text(stats.totalSent.toLocaleString());
                $('#recontacted').text(stats.recontacted.toLocaleString());
                $('#recontactRate').text(stats.recontactRate + '%');
                $('#callSuccess').text(stats.callSuccess.toLocaleString());
                $('#callSuccessRate').text(stats.callSuccessRate + '%');
                $('#avgResponseTime').text(stats.avgResponseTime);
            } else {
                console.error('❌ 통계 로딩 실패:', response.message);
                showStatsError();
            }
        },
        error: function(xhr, status, error) {
            console.error('❌ 통계 AJAX 오류:', { xhr, status, error });
            showStatsError();
        },
        complete: function() {
            // 로딩 상태 해제 및 인디케이터 숨김
            isLoadingStats = false;
            hideStatsLoading();
        }
    });
}

// 통계 카드 로딩 인디케이터 표시
function showStatsLoading() {
    $('.dashboard-card .card-value').each(function() {
        $(this).html('<div class="spinner-border spinner-border-sm text-primary" role="status"><span class="sr-only">Loading...</span></div>');
    });
}

// LMS 목록 데이터 로딩
function loadLmsList(page = 1) {
    console.log('📋 LMS 목록 로딩 시작 - 페이지:', page);
    $('.loading').show();
    
    const startDate = $('#startDate').val();
    const endDate = $('#endDate').val();
    const phoneFilter = $('#phoneFilter').val();
    const statusFilter = $('#statusFilter').val();
    
    console.log('🔍 검색 조건:', { startDate, endDate, phoneFilter, statusFilter });
    
    $.ajax({
        url: '/lms-tracking/api/lms-list',
        method: 'GET',
        headers: {
            'X-CSRF-TOKEN': window.csrfToken
        },
        data: {
            startDate: startDate,
            endDate: endDate,
            phone: phoneFilter,
            status: statusFilter,
            page: page,
            size: 20
        },
        success: function(response) {
            console.log('✅ LMS 목록 조회 성공:', response);
            $('.loading').hide();
            
            if (response.success) {
                renderLmsTable(response.data);
                renderPagination(response.currentPage, response.totalPages);
            } else {
                console.error('❌ 데이터 로딩 실패:', response.message);
                alert('데이터 로딩에 실패했습니다: ' + response.message);
            }
        },
        error: function(xhr, status, error) {
            console.error('❌ AJAX 오류:', { xhr, status, error });
            $('.loading').hide();
            alert('서버 오류가 발생했습니다: ' + error);
        }
    });
}

// LMS 테이블 렌더링
function renderLmsTable(data) {
    const tbody = $('#lmsTableBody');
    tbody.empty();
    
    if (data.length === 0) {
        tbody.append(`
            <tr>
                <td colspan="7" class="text-center text-muted py-4">
                    조회된 데이터가 없습니다.
                </td>
            </tr>
        `);
        return;
    }
    
    data.forEach(function(item) {
        const statusBadge = getStatusBadge(item.status);
        const followUpBadge = item.hasFollowUp ? 
            '<span class="badge success">있음</span>' : 
            '<span class="badge warning">없음</span>';
        
        tbody.append(`
            <tr>
                <td>${formatDate(item.sendDate)}</td>
                <td>${item.clid}</td>
                <td>${item.subject}</td>
                <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                    ${item.message}
                </td>
                <td>${statusBadge}</td>
                <td>${followUpBadge}</td>
                <td>
                    <a href="javascript:void(0)" class="link-button" onclick="showCallHistory(${item.id})">
                        📞 통화내역
                    </a>
                </td>
            </tr>
        `);
    });
}

// 페이지네이션 렌더링
function renderPagination(currentPage, totalPages) {
    const pagination = $('#pagination');
    pagination.empty();
    
    if (totalPages <= 1) return;
    
    let paginationHtml = '<nav><ul class="pagination justify-content-center">';
    
    // 이전 페이지
    if (currentPage > 1) {
        paginationHtml += `<li class="page-item">
            <a class="page-link" href="javascript:void(0)" onclick="loadLmsList(${currentPage - 1})">이전</a>
        </li>`;
    }
    
    // 페이지 번호들
    const startPage = Math.max(1, currentPage - 2);
    const endPage = Math.min(totalPages, currentPage + 2);
    
    for (let i = startPage; i <= endPage; i++) {
        const activeClass = i === currentPage ? 'active' : '';
        paginationHtml += `<li class="page-item ${activeClass}">
            <a class="page-link" href="javascript:void(0)" onclick="loadLmsList(${i})">${i}</a>
        </li>`;
    }
    
    // 다음 페이지
    if (currentPage < totalPages) {
        paginationHtml += `<li class="page-item">
            <a class="page-link" href="javascript:void(0)" onclick="loadLmsList(${currentPage + 1})">다음</a>
        </li>`;
    }
    
    paginationHtml += '</ul></nav>';
    pagination.html(paginationHtml);
}

// 통화 내역 상세 보기
function showCallHistory(lmsId) {
    $.ajax({
        url: `/lms-tracking/api/call-history/${lmsId}`,
        method: 'GET',
        success: function(response) {
            if (response.success) {
                renderCallHistory(response.data);
                $('#callHistoryModal').show();
            } else {
                alert('통화 내역을 불러올 수 없습니다: ' + response.message);
            }
        },
        error: function() {
            alert('서버 오류가 발생했습니다.');
        }
    });
}

// 통화 내역 렌더링
function renderCallHistory(data) {
    const content = $('#callHistoryContent');
    content.empty();
    
    if (data.length === 0) {
        content.html(`
            <div class="text-center text-muted py-4">
                후속 통화 내역이 없습니다.
            </div>
        `);
        return;
    }
    
    let historyHtml = `
        <table class="table">
            <thead>
                <tr>
                    <th>통화일시</th>
                    <th>상담원</th>
                    <th>결과</th>
                    <th>내용</th>
                    <th>확인</th>
                </tr>
            </thead>
            <tbody>
    `;
    
    data.forEach(function(item) {
        const resultBadge = getCallResultBadge(item.result);
        const confirmBadge = getConfirmBadge(item.confirm);
        
        historyHtml += `
            <tr>
                <td>${formatDate(item.callDate)}</td>
                <td>${item.agent}</td>
                <td>${resultBadge}</td>
                <td>${item.context}</td>
                <td>${confirmBadge}</td>
            </tr>
        `;
    });
    
    historyHtml += '</tbody></table>';
    content.html(historyHtml);
}

// 유틸리티 함수들
function getStatusBadge(status) {
    switch(status) {
        case 'SENT':
            return '<span class="badge success">발송완료</span>';
        case 'PENDING':
            return '<span class="badge warning">대기중</span>';
        case 'FAILED':
            return '<span class="badge danger">실패</span>';
        default:
            return '<span class="badge info">' + status + '</span>';
    }
}

function getCallResultBadge(result) {
    if (result.includes('완료') || result.includes('성공')) {
        return '<span class="badge success">' + result + '</span>';
    } else if (result.includes('미응답') || result.includes('실패')) {
        return '<span class="badge danger">' + result + '</span>';
    } else if (result.includes('시도')) {
        return '<span class="badge warning">' + result + '</span>';
    } else {
        return '<span class="badge info">' + result + '</span>';
    }
}

function getConfirmBadge(confirm) {
    switch(confirm) {
        case 'CONFIRMED':
            return '<span class="badge success">확인됨</span>';
        case 'FAILED':
            return '<span class="badge danger">실패</span>';
        case 'ATTEMPTED':
            return '<span class="badge warning">시도중</span>';
        default:
            return '<span class="badge info">' + confirm + '</span>';
    }
}

function formatDate(dateString) {
    if (!dateString) return '-';
    
    const date = new Date(dateString);
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    
    return `${year}-${month}-${day} ${hours}:${minutes}`;
}
