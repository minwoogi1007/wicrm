<!-- CSRF 토큰 자동 전달 (모든 AJAX 요청에 CSRF 헤더 자동 포함) -->
<script>
(function() {
    var csrfToken = document.querySelector('meta[name="_csrf"]');
    var csrfHeader = document.querySelector('meta[name="_csrf_header"]');
    if (csrfToken && csrfHeader && csrfToken.content) {
        // jQuery AJAX 전역 설정
        $.ajaxSetup({
            beforeSend: function(xhr) {
                xhr.setRequestHeader(csrfHeader.content, csrfToken.content);
            }
        });
        // fetch API 래퍼 (기존 fetch를 오버라이드하지 않고 전역 함수 제공)
        window.csrfFetch = function(url, options) {
            options = options || {};
            options.headers = options.headers || {};
            options.headers[csrfHeader.content] = csrfToken.content;
            return fetch(url, options);
        };
    }
})();
</script>

<script>
	// plugins.bundle.js가 jQuery를 재초기화할 수 있으므로, 
	// 레이아웃 하단에서 CSRF + 401 처리를 다시 설정
	(function() {
		function getCsrfTokenFromCookie() {
			var match = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
			return match ? decodeURIComponent(match[1]) : null;
		}
		$.ajaxSetup({
			beforeSend: function(xhr) {
				var token = getCsrfTokenFromCookie();
				if (token) {
					xhr.setRequestHeader('X-XSRF-TOKEN', token);
				}
			},
			complete: function(xhr, textStatus) {
				if (xhr.status === 401) {
					window.location.href = '/login';
				}
			}
		});
	})();
	document.addEventListener('DOMContentLoaded', function() {
		var downloadButton = document.getElementById('downloadButton');
		if (downloadButton) {  // 버튼이 존재하는지 확인
			downloadButton.addEventListener('click', function() {
				var content = document.getElementById('contentToDownload');

				// Null 체크 및 에러 로깅 추가
				if (!content) {
					console.error('Content to download is null or undefined');
					return;
				}

				html2canvas(content).then(function(canvas) {
					if (!canvas) {
						console.error('Failed to create canvas');
						return;
					}

					var imgData = canvas.toDataURL('image/png');
					var { jsPDF } = window.jspdf;
					var pdf = new jsPDF('p', 'mm', 'a4');
					var imgWidth = 210;
					var pageHeight = 295;
					var imgHeight = canvas.height * imgWidth / canvas.width;
					var heightLeft = imgHeight;
					var position = 0;

					pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
					heightLeft -= pageHeight;

					while (heightLeft >= 0) {
						position = heightLeft - imgHeight;
						pdf.addPage();
						pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
						heightLeft -= pageHeight;
					}
					pdf.save('dashboard-content.pdf');
				}).catch(function(error) {
					console.error('Error generating PDF:', error);
				});
			});
		}
	});
</script>
