<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="head" id="kt_app_header" class="app-header">
    <!--begin::Header container-->
    <div class="app-container container-fluid d-flex align-items-stretch justify-content-between" id="kt_app_header_container">
        <!--begin::sidebar mobile toggle-->
        <div class="d-flex align-items-center d-lg-none ms-n2 me-1" title="Show sidebar menu">
            <div class="btn btn-icon btn-active-color-primary w-40px h-40px" id="kt_app_sidebar_mobile_toggle">
                <i class="ki-duotone ki-abstract-14 fs-1">
                    <span class="path1"></span>
                    <span class="path2"></span>
                </i>
            </div>
        </div>
        <!--end::sidebar mobile toggle-->
        <!--begin::Mobile logo-->
        <div class="d-flex align-items-center flex-grow-1 flex-lg-grow-0">
            <a href="/main" class="d-lg-none">
                <img alt="Logo" src="/assets/media/logos/small.svg" class="theme-light-show h-25px" />
                <img alt="Logo" src="/assets/media/logos/small.svg" class="theme-dark-show h-25px" />
            </a>
        </div>
        <!--end::Mobile logo-->
        <!--begin::Header wrapper-->
        <div class="d-flex align-items-stretch justify-content-between flex-lg-grow-1" id="kt_app_header_wrapper">
            <!--begin::Menu wrapper-->
            <div class="app-header-menu app-header-mobile-drawer align-items-stretch" data-kt-drawer="true" data-kt-drawer-name="app-header-menu" data-kt-drawer-activate="{default: true, lg: false}" data-kt-drawer-overlay="true" data-kt-drawer-width="225px" data-kt-drawer-direction="end" data-kt-drawer-toggle="#kt_app_header_menu_toggle" data-kt-swapper="true" data-kt-swapper-mode="{default: 'append', lg: 'prepend'}" data-kt-swapper-parent="{default: '#kt_app_body', lg: '#kt_app_header_wrapper'}">
                <!--begin::Menu-->
                <div class="menu menu-rounded menu-column menu-lg-row my-5 my-lg-0 align-items-stretch fw-semibold px-2 px-lg-0" id="kt_app_header_menu" data-kt-menu="true">
                    <!--begin:Menu item-->
                    <div data-kt-menu-trigger="{default: 'click', lg: 'hover'}" data-kt-menu-placement="bottom-start" class="menu-item  menu-lg-down-accordion menu-sub-lg-down-indention me-0 me-lg-2">
                        <!--begin:Menu link-->
                        <span class="menu-link">
                            <span class="menu-title">Dashboards</span>
                            <span class="menu-arrow d-lg-none"></span>

                        </span>
                        <!--end:Menu link-->
                    </div>

                    <!--end:Menu item-->
                </div>
                <!--end::Menu-->
            </div>

            <!--end::Menu wrapper-->
            <!--begin::Navbar-->
            <div class="app-navbar flex-shrink-0">
                <!--begin::Font size control-->
                <div class="app-navbar-item ms-1 ms-lg-3">
                    <div class="d-flex align-items-center bg-hover-light rounded p-1" id="fontSizeControl">
                        <button type="button" class="btn btn-icon btn-sm btn-light-primary w-30px h-30px" onclick="changeFontSize('decrease')" title="글꼴 축소">
                            <span class="fw-bolder fs-7">A-</span>
                        </button>
                        <button type="button" class="btn btn-icon btn-sm btn-light w-30px h-30px mx-1" onclick="changeFontSize('reset')" title="글꼴 초기화">
                            <span class="fw-bolder fs-7">A</span>
                        </button>
                        <button type="button" class="btn btn-icon btn-sm btn-light-primary w-30px h-30px" onclick="changeFontSize('increase')" title="글꼴 확대">
                            <span class="fw-bolder fs-7">A+</span>
                        </button>
                    </div>
                </div>
                <!--end::Font size control-->
                <!--begin::User menu-->
                <div class="app-navbar-item ms-2 ms-1 ms-lg-3" id="kt_header_user_menu_toggle">

                    <!--begin::Menu wrapper-->
                    <div class="cursor-pointer symbol symbol-35px symbol-md-40px" data-kt-menu-trigger="{default: 'click', lg: 'hover'}" data-kt-menu-attach="parent" data-kt-menu-placement="bottom-end">
                        <img src="/assets/media/avatars/blank.png" alt="user" />
                    </div>
                    <!--begin::User account menu-->
                    <div class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-800 menu-state-bg menu-state-color fw-semibold py-4 fs-6 w-275px" data-kt-menu="true">
                        <!--begin::Menu item-->
                        <div class="menu-item px-3">
                            <div class="menu-content d-flex align-items-center px-3">
                                <!--begin::Avatar-->
                                <div class="symbol symbol-50px me-5">
                                    <img alt="Logo" src="/assets/media/avatars/blank.png" />
                                </div>
                                <!--end::Avatar-->
                                <!--begin::Username-->
                                <div class="d-flex flex-column">
                                    <div th:text="${session.loginUserId}"class="fw-bold d-flex align-items-center fs-5">

                                    </div>
                                    <a href="#" class="fw-semibold text-muted text-hover-primary fs-7" id="loginUserNameSpan" th:text="${session.loginUserName}"></a>
                                </div>
                                <!--end::Username-->
                            </div>
                        </div>
                        <!--end::Menu item-->
                        <div class="separator my-2"></div>
                        <!--begin::Menu item-->
                        <div class="menu-item px-5 my-1">
                            <a href="/account" class="menu-link px-5">계정정보</a>
                        </div>
                        <!--end::Menu item-->
                        <!--begin::Menu item-->
                        <div class="menu-item px-5">
                            <a href="/login" class="menu-link px-5">Sign Out</a>
                        </div>
                        <!--end::Menu item-->
                    </div>

                    <!--end::User account menu-->
                </div>
                <!--end::User menu-->
            </div>
            <!--end::Navbar-->
        </div>
        <!--end::Header wrapper-->
    </div>
    <script src="/assets/plugins/global/plugins.bundle.js"></script>
    <script src="/assets/js/board/scripts.bundle.js"></script>
    <!--end::Header container-->
    <script>
        // 글꼴 크기 조절 (헤더의 A-/A/A+ 버튼에서 사용)
        // 모든 페이지에서 동작하도록 head fragment 안에 정의
        (function() {
            if (typeof window.fontSizeLevels === 'undefined') {
                window.fontSizeLevels = ['', 'font-size-sm', '', 'font-size-lg', 'font-size-xl'];
            }
            if (typeof window.fontSizeIndex === 'undefined') {
                window.fontSizeIndex = 2;
                var saved = localStorage.getItem('wicrm-font-size');
                if (saved !== null) {
                    var idx = parseInt(saved, 10);
                    if (!isNaN(idx) && idx >= 0 && idx <= 4) window.fontSizeIndex = idx;
                }
            }

            window.applyFontSize = function() {
                var el = document.getElementById('kt_app_main') || document.body;
                if (!el) return;
                el.classList.remove('font-size-sm', 'font-size-lg', 'font-size-xl');
                var cls = window.fontSizeLevels[window.fontSizeIndex];
                if (cls) el.classList.add(cls);
            };

            window.changeFontSize = function(action) {
                if (action === 'increase' && window.fontSizeIndex < 4) {
                    window.fontSizeIndex++;
                } else if (action === 'decrease' && window.fontSizeIndex > 0) {
                    window.fontSizeIndex--;
                } else if (action === 'reset') {
                    window.fontSizeIndex = 2;
                }
                localStorage.setItem('wicrm-font-size', window.fontSizeIndex);
                window.applyFontSize();
            };

            // DOM 준비 후 저장된 글꼴 크기 적용
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', window.applyFontSize);
            } else {
                window.applyFontSize();
            }
        })();
    </script>
</div>

</html>
