<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main}">
<!--begin::Main-->
<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
<div layout:fragment="content">
    <div class="d-flex flex-column flex-column-fluid">
        <!--begin::Content-->
        <div id="kt_app_content" class="app-content flex-column-fluid">
            <!--begin::Content container-->
            <div id="kt_app_content_container" class="app-container container-xxl">
                <div class="card card-flush mb-6">
                    <div class="card-body text-center py-20">
                        <!-- 아이콘 -->
                        <div class="mb-10">
                            <i class="ki-duotone ki-disconnect fs-5tx text-danger">
                                <span class="path1"></span>
                                <span class="path2"></span>
                                <span class="path3"></span>
                                <span class="path4"></span>
                                <span class="path5"></span>
                            </i>
                        </div>
                        
                        <!-- 500 숫자 -->
                        <h1 class="fw-bolder text-gray-900 mb-5" style="font-size: 6rem;">500</h1>
                        
                        <!-- 제목 -->
                        <h2 class="fw-bold text-gray-800 mb-4">서버 오류가 발생했습니다</h2>
                        
                        <!-- 설명 -->
                        <p class="text-gray-600 fs-5 mb-8" th:text="${errorMessage != null ? errorMessage : '서버에서 요청을 처리하는 중 오류가 발생했습니다.'}"></p>
                        
                        <!-- 안내 메시지 -->
                        <div class="alert alert-light-warning d-inline-flex align-items-center py-3 px-5 mb-10">
                            <i class="ki-duotone ki-information-5 fs-2 me-3 text-warning">
                                <span class="path1"></span>
                                <span class="path2"></span>
                                <span class="path3"></span>
                            </i>
                            <span class="text-gray-700">잠시 후 다시 시도해주세요. 문제가 계속되면 관리자에게 문의해주세요.</span>
                        </div>
                        
                        <!-- 버튼 -->
                        <div class="d-flex flex-center gap-3">
                            <a href="javascript:location.reload()" class="btn btn-light-primary">
                                <i class="ki-duotone ki-arrows-circle fs-4 me-1">
                                    <span class="path1"></span>
                                    <span class="path2"></span>
                                </i>
                                다시 시도
                            </a>
                            <a href="javascript:history.back()" class="btn btn-light">
                                <i class="ki-duotone ki-arrow-left fs-4 me-1">
                                    <span class="path1"></span>
                                    <span class="path2"></span>
                                </i>
                                이전 페이지
                            </a>
                            <a href="/main" class="btn btn-primary">
                                <i class="ki-duotone ki-home fs-4 me-1">
                                    <span class="path1"></span>
                                    <span class="path2"></span>
                                </i>
                                메인으로 이동
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <!--end::Content container-->
        </div>
        <!--end::Content-->
    </div>
</div>
</html>
