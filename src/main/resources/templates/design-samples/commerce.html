<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{design-samples/public-layout}">
<body>
<div layout:fragment="content">
    <link href="/assets/css/design-samples/admin-modern.css" rel="stylesheet" type="text/css" />
    <link href="/assets/css/design-samples/admin-pages.css" rel="stylesheet" type="text/css" />

    <main class="admin-sample-page commerce-page">
        <header class="sample-page-header">
            <a href="/design-samples/admin" class="back-link">샘플 목록</a>
            <span class="sample-kicker">Commerce Control</span>
            <h1>교환/반품 물류 관제형 화면</h1>
            <p>접수부터 정산까지 상태 흐름이 중요한 업무에 맞춘 운영 센터 디자인입니다.</p>
        </header>

        <section class="control-map">
            <article><span>교환 접수</span><strong>86</strong><small>전일 대비 +8</small></article>
            <article><span>반품 검수</span><strong>41</strong><small>지연 6건</small></article>
            <article><span>직접 회수</span><strong>31</strong><small>기사 배정 24건</small></article>
            <article><span>정산 대기</span><strong>19</strong><small>입금 확인 필요</small></article>
        </section>

        <section class="flow-board">
            <div class="flow-lane active"><b>접수</b><span>152건</span><i></i></div>
            <div class="flow-lane active"><b>검수</b><span>74건</span><i></i></div>
            <div class="flow-lane"><b>회수</b><span>31건</span><i></i></div>
            <div class="flow-lane"><b>정산</b><span>19건</span><i></i></div>
            <div class="flow-lane"><b>완료</b><span>118건</span><i></i></div>
        </section>

        <section class="logistics-list">
            <div class="list-header"><b>오늘 집중 처리 대상</b><button type="button">엑셀 다운로드</button></div>
            <div class="logistics-row"><span>ORD-240425-018</span><b>사이즈 교환</b><em class="warn">검수 지연</em><small>담당: 이현우</small></div>
            <div class="logistics-row"><span>ORD-240425-031</span><b>단순 변심 반품</b><em>회수 예정</em><small>담당: 오지수</small></div>
            <div class="logistics-row"><span>ORD-240425-049</span><b>입금 재확인</b><em class="ok">정상</em><small>담당: 김민우</small></div>
        </section>
    </main>
</div>
</body>
</html>
