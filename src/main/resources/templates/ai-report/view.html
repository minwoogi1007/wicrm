<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main}">

<div layout:fragment="content">
    <style>
        .report-hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 2rem;
            color: white;
            margin-bottom: 2rem;
        }
        
        .report-hero h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .kpi-card {
            background: white;
            border-radius: 12px;
            padding: 1.25rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        
        .kpi-card .icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        
        .kpi-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
        }
        
        .kpi-card .label {
            font-size: 0.8rem;
            color: #64748b;
        }
        
        .section-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 1.5rem;
        }
        
        .section-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .keyword-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            margin: 0.25rem;
            font-size: 0.875rem;
        }
        
        .keyword-tag.positive { background: #d1fae5; color: #059669; }
        .keyword-tag.negative { background: #fee2e2; color: #dc2626; }
        .keyword-tag.neutral { background: #e2e8f0; color: #475569; }
        
        .sentiment-bar {
            display: flex;
            height: 24px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        
        .sentiment-bar .positive { background: #10b981; }
        .sentiment-bar .neutral { background: #6b7280; }
        .sentiment-bar .negative { background: #ef4444; }
        
        .sentiment-legend {
            display: flex;
            justify-content: center;
            gap: 2rem;
        }
        
        .sentiment-legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }
        
        .sentiment-legend-item .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .recommendation-card {
            border-left: 4px solid #667eea;
            background: #f8fafc;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 0 8px 8px 0;
        }
        
        .recommendation-card.high { border-left-color: #ef4444; }
        .recommendation-card.medium { border-left-color: #f59e0b; }
        .recommendation-card.low { border-left-color: #10b981; }
        
        .recommendation-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .recommendation-desc {
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        
        .priority-badge {
            padding: 0.125rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .priority-badge.high { background: #fee2e2; color: #dc2626; }
        .priority-badge.medium { background: #fef3c7; color: #d97706; }
        .priority-badge.low { background: #d1fae5; color: #059669; }
        
        .issue-list li {
            padding: 0.75rem 0;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .issue-list li:last-child {
            border-bottom: none;
        }
        
        .issue-number {
            width: 24px;
            height: 24px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>

    <div class="d-flex flex-column flex-column-fluid">
        <div id="kt_app_content" class="app-content flex-column-fluid">
            <div id="kt_app_content_container" class="app-container container-xxl">
                
                <!-- 뒤로가기 -->
                <a th:href="@{/ai-report}" class="btn btn-light btn-sm mb-3">
                    ← 목록으로
                </a>
                
                <!-- 리포트 헤더 -->
                <div class="report-hero">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h1 th:text="${report.reportTitle}">2025년 12월 상담 분석 리포트</h1>
                            <p th:text="'생성일: ' + ${#dates.format(report.inDate, 'yyyy-MM-dd HH:mm')}">생성일: 2025-12-17</p>
                        </div>
                        <div class="d-flex gap-2">
                            <button th:if="${report.pdfPath}" class="btn btn-light btn-sm">
                                📄 PDF 다운로드
                            </button>
                            <button th:if="${report.excelPath}" class="btn btn-light btn-sm">
                                📊 Excel 다운로드
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 처리 중인 경우 -->
                <div th:if="${report.status == 'PROCESSING' or report.status == 'PENDING'}" class="text-center py-5">
                    <div class="spinner-border text-primary mb-3" role="status"></div>
                    <h4>AI가 분석 중입니다...</h4>
                    <p class="text-muted">잠시만 기다려주세요. 완료되면 알림을 보내드립니다.</p>
                    <button class="btn btn-primary mt-3" onclick="location.reload()">새로고침</button>
                </div>
                
                <!-- 분석 완료된 경우 -->
                <div th:if="${report.status == 'COMPLETED'}">
                    
                    <!-- KPI 카드 -->
                    <div class="kpi-grid">
                        <div class="kpi-card">
                            <div class="icon">📊</div>
                            <div class="value" th:text="${report.totalConsultations}">0</div>
                            <div class="label">총 상담 건수</div>
                        </div>
                        <div class="kpi-card">
                            <div class="icon">✅</div>
                            <div class="value" th:text="${#numbers.formatDecimal(report.completionRate, 0, 1) + '%'}">0%</div>
                            <div class="label">처리 완료율</div>
                        </div>
                        <div class="kpi-card">
                            <div class="icon">🚨</div>
                            <div class="value" th:text="${report.urgentCount}">0</div>
                            <div class="label">긴급 상담</div>
                        </div>
                        <div class="kpi-card">
                            <div class="icon">⚠️</div>
                            <div class="value" th:text="${report.claimCount}">0</div>
                            <div class="label">클레임</div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <!-- 왼쪽 컬럼 -->
                        <div class="col-lg-8">
                            <!-- 요약 섹션 -->
                            <div class="section-card">
                                <div class="section-title">📝 분석 요약</div>
                                <div id="summaryContent" class="text-gray-700"></div>
                                <div th:if="${report.summaryJson}" th:attr="data-json=${report.summaryJson}" id="summaryData"></div>
                            </div>
                            
                            <!-- AI 개선 제안 -->
                            <div class="section-card">
                                <div class="section-title">💡 AI 개선 제안</div>
                                <div id="recommendationsContent"></div>
                                <div th:if="${report.recommendations}" th:attr="data-json=${report.recommendations}" id="recommendationsData"></div>
                            </div>
                        </div>
                        
                        <!-- 오른쪽 컬럼 -->
                        <div class="col-lg-4">
                            <!-- 감정 분석 -->
                            <div class="section-card">
                                <div class="section-title">😊 고객 감정 분석</div>
                                <div class="sentiment-bar" id="sentimentBar">
                                    <div class="positive" style="width: 35%"></div>
                                    <div class="neutral" style="width: 45%"></div>
                                    <div class="negative" style="width: 20%"></div>
                                </div>
                                <div class="sentiment-legend">
                                    <div class="sentiment-legend-item">
                                        <div class="dot" style="background: #10b981"></div>
                                        <span id="positivePercent">긍정 35%</span>
                                    </div>
                                    <div class="sentiment-legend-item">
                                        <div class="dot" style="background: #6b7280"></div>
                                        <span id="neutralPercent">중립 45%</span>
                                    </div>
                                    <div class="sentiment-legend-item">
                                        <div class="dot" style="background: #ef4444"></div>
                                        <span id="negativePercent">부정 20%</span>
                                    </div>
                                </div>
                                <div th:if="${report.sentimentJson}" th:attr="data-json=${report.sentimentJson}" id="sentimentData"></div>
                            </div>
                            
                            <!-- 주요 키워드 -->
                            <div class="section-card">
                                <div class="section-title">🔥 주요 키워드</div>
                                <div id="keywordsContent"></div>
                                <div th:if="${report.keywordsJson}" th:attr="data-json=${report.keywordsJson}" id="keywordsData"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 실패한 경우 -->
                <div th:if="${report.status == 'FAILED'}" class="alert alert-danger">
                    <h5>⚠️ 분석 실패</h5>
                    <p th:text="${report.errorMessage}">오류가 발생했습니다.</p>
                    <button class="btn btn-danger btn-sm">재시도</button>
                </div>
                
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 요약 데이터 렌더링
            var summaryEl = document.getElementById('summaryData');
            if (summaryEl && summaryEl.dataset.json) {
                try {
                    var summary = JSON.parse(summaryEl.dataset.json);
                    var html = '<p>' + (summary.summary || '') + '</p>';
                    
                    if (summary.mainIssues && summary.mainIssues.length > 0) {
                        html += '<h6 class="mt-3">주요 이슈</h6><ul class="issue-list list-unstyled">';
                        summary.mainIssues.forEach(function(issue, i) {
                            html += '<li><span class="issue-number">' + (i+1) + '</span>' + issue + '</li>';
                        });
                        html += '</ul>';
                    }
                    
                    document.getElementById('summaryContent').innerHTML = html;
                } catch(e) {
                    document.getElementById('summaryContent').innerHTML = summaryEl.dataset.json;
                }
            }
            
            // 감정 분석 렌더링
            var sentimentEl = document.getElementById('sentimentData');
            if (sentimentEl && sentimentEl.dataset.json) {
                try {
                    var sentiment = JSON.parse(sentimentEl.dataset.json);
                    var dist = sentiment.distribution || {};
                    
                    document.querySelector('.sentiment-bar .positive').style.width = (dist.positive || 0) + '%';
                    document.querySelector('.sentiment-bar .neutral').style.width = (dist.neutral || 0) + '%';
                    document.querySelector('.sentiment-bar .negative').style.width = (dist.negative || 0) + '%';
                    
                    document.getElementById('positivePercent').textContent = '긍정 ' + (dist.positive || 0) + '%';
                    document.getElementById('neutralPercent').textContent = '중립 ' + (dist.neutral || 0) + '%';
                    document.getElementById('negativePercent').textContent = '부정 ' + (dist.negative || 0) + '%';
                } catch(e) {}
            }
            
            // 키워드 렌더링
            var keywordsEl = document.getElementById('keywordsData');
            if (keywordsEl && keywordsEl.dataset.json) {
                try {
                    var keywords = JSON.parse(keywordsEl.dataset.json);
                    var html = '';
                    
                    if (keywords.products) {
                        keywords.products.forEach(function(p) {
                            var cls = p.sentiment || 'neutral';
                            html += '<span class="keyword-tag ' + cls + '">' + p.name + ' (' + p.count + ')</span>';
                        });
                    }
                    
                    if (keywords.issues) {
                        keywords.issues.forEach(function(issue) {
                            html += '<span class="keyword-tag neutral">' + issue.type + ' (' + issue.count + ')</span>';
                        });
                    }
                    
                    document.getElementById('keywordsContent').innerHTML = html;
                } catch(e) {}
            }
            
            // 개선 제안 렌더링
            var recEl = document.getElementById('recommendationsData');
            if (recEl && recEl.dataset.json) {
                try {
                    var data = JSON.parse(recEl.dataset.json);
                    var recs = data.recommendations || [];
                    var html = '';
                    
                    recs.forEach(function(rec) {
                        var priority = rec.priority || 'medium';
                        html += '<div class="recommendation-card ' + priority + '">';
                        html += '<div class="d-flex justify-content-between align-items-start">';
                        html += '<div class="recommendation-title">' + rec.title + '</div>';
                        html += '<span class="priority-badge ' + priority + '">' + 
                                (priority === 'high' ? '높음' : priority === 'medium' ? '중간' : '낮음') + '</span>';
                        html += '</div>';
                        html += '<div class="recommendation-desc">' + rec.description + '</div>';
                        if (rec.expectedEffect) {
                            html += '<small class="text-success">📈 ' + rec.expectedEffect + '</small>';
                        }
                        html += '</div>';
                    });
                    
                    document.getElementById('recommendationsContent').innerHTML = html;
                } catch(e) {}
            }
        });
    </script>
</div>
</html>
