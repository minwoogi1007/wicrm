<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<div layout:fragment="content">
    <style>
        /* 헤더 정렬 스타일 - list.html과 동일하게 */
        #kt_app_toolbar {
            padding: 0.75rem 0 !important;
            min-height: auto !important;
        }
        
        #kt_app_toolbar_container {
            padding-left: 1rem !important;
            margin-left: 0 !important;
        }
        
        .page-title {
            margin: 0 !important;
            padding: 0 !important;
            margin-left: 0 !important;
        }
        
        .page-heading {
            margin: 0 !important;
        }
        
        .breadcrumb {
            margin: 0 !important;
            padding-top: 0.25rem !important;
        }
        
        #kt_app_content {
            padding-top: 2.5rem !important;
            margin-top: 0 !important;
        }
        
        /* 컨텐츠 영역은 원래 패딩 유지 */
        #kt_app_content_container.app-container {
            padding-left: 1rem !important;
            padding-right: 1rem !important;
        }

        /* 입금 등록 전용 스타일 */
        .payment-container {
            padding: 1.5rem !important;
            width: 100%;
        }
        
        /* 심플 헤더 */
        .simple-header {
            padding: 1rem 0;
            border-bottom: 1px solid #e9ecef;
        }
        
        /* 폼 카드 */
        .form-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            margin-bottom: 2rem;
        }
        
        .form-card-header {
            background: transparent;
            padding: 1.5rem;
            border-bottom: 1px solid #e9ecef;
        }
        
        .form-card-body {
            padding: 2rem;
        }
        
        /* 입력 필드 스타일 */
        .form-label {
            font-weight: 600;
            color: #3f4254;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        .form-control,
        .form-select {
            border: 2px solid #e4e6ef;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus,
        .form-select:focus {
            border-color: #495057;
            box-shadow: 0 0 0 0.2rem rgba(73, 80, 87, 0.25);
            transform: translateY(-1px);
        }
        
        /* 필수 필드 표시 */
        .required::after {
            content: ' *';
            color: #e74c3c;
            font-weight: bold;
        }
        
        /* 브랜드 선택 버튼 - 파란색 스타일 */
        .brand-selector {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .brand-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #e9ecef;
            background: white;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 600;
            color: #495057;
        }
        
        .brand-btn:hover {
            border-color: #4361ee;
            background: #4361ee;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.2);
        }
        
        .brand-btn.active {
            border-color: #4361ee;
            background: #4361ee;
            color: white;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(67, 97, 238, 0.25);
        }
        
        .brand-btn .brand-name {
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        /* 입력 그룹 스타일 */
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            z-index: 3;
            opacity: 0.7;
        }
        
        .input-group .form-control,
        .input-group .form-select {
            padding-left: 3rem;
        }
        
        /* 금액 입력 스타일 */
        .amount-input {
            font-size: 1.1rem;
            font-weight: 600;
            text-align: right;
            background: transparent;
        }
        
        /* 날짜/시간 입력 스타일 */
        .datetime-inputs {
            display: flex;
            gap: 1rem;
        }
        
        .datetime-inputs .form-control {
            flex: 1;
        }
        
        /* 버튼 스타일 */
        .btn-register {
            background: #4361ee;
            border: 2px solid #4361ee;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-register:hover {
            background: #3f37c9;
            border-color: #3f37c9;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(67, 97, 238, 0.3);
        }
        
        .btn-reset {
            background: #6c757d;
            border: 2px solid #6c757d;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-reset:hover {
            background: #5a6268;
            border-color: #5a6268;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(108, 117, 125, 0.3);
        }
        
        /* 최근 입금 내역 카드 */
        .recent-payments {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        
        .recent-payments-header {
            background: transparent;
            padding: 1.5rem;
            border-bottom: 1px solid #e9ecef;
        }
        
        .recent-payments-body {
            padding: 1.5rem;
        }
        
        .payment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            margin-bottom: 8px;
            background: white;
            transition: all 0.2s ease;
        }
        
        .payment-item.status-pending {
            border-left: 4px solid #ffc107;
        }
        
        .payment-item.status-mapped {
            border-left: 4px solid #198754;
        }
        
        .payment-item:hover {
            border-color: #495057;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transform: translateY(-1px);
        }
        
        .payment-info {
            flex: 1;
        }
        
        .payment-brand-customer {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .brand-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            background: transparent;
            border: 1px solid;
        }
        
        .brand-badge.renoma {
            border-color: #495057;
            color: #495057;
        }
        
        .brand-badge.coralique {
            border-color: #6c757d;
            color: #6c757d;
        }
        
        .customer-name {
            font-weight: 600;
            color: #181c32;
            font-size: 14px;
        }
        
        .payment-customer {
            font-weight: 600;
            color: #3f4254;
            margin-bottom: 0.2rem;
        }
        
        .payment-details {
            font-size: 13px;
            color: #7e8299;
        }
        
        .payment-bank-time {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        
        .payment-date {
            display: flex;
            align-items: center;
        }
        
        .payment-amount {
            font-weight: 700;
            font-size: 16px;
            color: #181c32;
            text-align: right;
            margin-bottom: 6px;
        }
        
        .payment-status {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 4px;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            background: transparent;
            border: 1px solid;
        }
        
        .status-pending {
            border-color: #ffc107;
            color: #ffc107;
        }
        
        .status-mapped {
            border-color: #198754;
            color: #198754;
        }
        
        /* 도움말 툴팁 */
        .help-tooltip {
            position: relative;
            display: inline-block;
            margin-left: 0.5rem;
            cursor: help;
        }
        
        .help-tooltip .tooltip-text {
            visibility: hidden;
            width: 200px;
            background: #333;
            color: white;
            text-align: center;
            border-radius: 6px;
            padding: 0.5rem;
            position: absolute;
            z-index: 1000;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.8rem;
        }
        
        .help-tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        
        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .payment-container {
                padding: 1rem !important;
            }
            
            .brand-selector {
                flex-direction: column;
            }
            
            .datetime-inputs {
                flex-direction: column;
            }
            
            .d-flex.gap-3 {
                flex-direction: column;
                gap: 1rem !important;
            }
            
            .btn-register,
            .btn-reset {
                width: 100%;
                margin-bottom: 0.5rem;
            }
        }
        
        /* 애니메이션 */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .form-card,
        .recent-payments {
            animation: slideInUp 0.4s ease-out;
        }
        
        .recent-payments {
            animation-delay: 0.05s;
        }
        
        /* 로딩 스피너 */
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 2rem;
        }
        
        .spinner-border {
            width: 2rem;
            height: 2rem;
            border-width: 0.2em;
        }

        /* 검색 필터 스타일 */
        .search-filters {
            background: transparent;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 1rem;
        }
        
        .search-filters .form-control,
        .search-filters .form-select {
            border: 1px solid #d1d3e2;
            border-radius: 6px;
            font-size: 0.8rem;
            padding: 0.4rem 0.6rem;
        }
        
        .search-filters .form-control:focus,
        .search-filters .form-select:focus {
            border-color: #495057;
            box-shadow: 0 0 0 0.1rem rgba(73, 80, 87, 0.25);
        }
        
        .search-filters .btn {
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        /* 검색 버튼 스타일 */
        .search-filters .btn-primary {
            background: #4361ee;
            border-color: #4361ee;
            color: white;
        }
        
        .search-filters .btn-primary:hover {
            background: #3f37c9;
            border-color: #3f37c9;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(67, 97, 238, 0.3);
        }
        
        .search-filters .btn-secondary {
            background: #6c757d;
            border-color: #6c757d;
            color: white;
        }
        
        .search-filters .btn-secondary:hover {
            background: #5a6268;
            border-color: #5a6268;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(108, 117, 125, 0.3);
        }
        
        /* 검색 통계 */
        .search-stats {
            background: transparent;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 0.5rem 0.8rem;
            text-align: center;
        }
        
        /* 페이징 스타일 */
        .pagination-container {
            border-top: 1px solid #e9ecef;
            padding-top: 1rem;
        }
        
        .pagination-sm .page-link {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }
        
        .pagination-sm .page-item.active .page-link {
            background-color: #4361ee;
            border-color: #4361ee;
            color: white;
            font-weight: 700;
        }
        
        .pagination-sm .page-link:hover {
            background-color: #4361ee;
            border-color: #4361ee;
            color: white;
        }
        
        /* 입금 내역 리스트 개선 */
        #paymentList {
            background: transparent;
            border: none;
            border-radius: 8px;
        }
        
        #paymentList .payment-item {
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        
        #paymentList .payment-item:last-child {
            margin-bottom: 0;
        }
        
        /* 사이트명과 비고 스타일 */
        .payment-site,
        .payment-notes {
            font-size: 0.75rem;
            color: #6c757d;
            margin-top: 2px;
        }
        
        .payment-notes {
            font-style: italic;
        }
        
        /* 빈 상태 스타일 */
        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: #6c757d;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        /* 수정/삭제 버튼 스타일 */
        .payment-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            justify-content: flex-end;
        }
        
        .btn-edit,
        .btn-delete {
            padding: 0.25rem 0.6rem;
            font-size: 0.75rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        
        .btn-edit {
            background: transparent;
            border: 1px solid #0d6efd;
            color: #0d6efd;
        }
        
        .btn-edit:hover:not(:disabled) {
            background: #0d6efd;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(13, 110, 253, 0.15);
        }
        
        .btn-delete {
            background: transparent;
            border: 1px solid #dc3545;
            color: #dc3545;
        }
        
        .btn-delete:hover:not(:disabled) {
            background: #dc3545;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(220, 53, 69, 0.15);
        }
        
        .btn-edit:disabled,
        .btn-delete:disabled {
            background: transparent;
            border-color: #e9ecef;
            color: #6c757d;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        /* 매핑 상태별 스타일 */
        .payment-item.status-mapped .btn-edit,
        .payment-item.status-mapped .btn-delete {
            display: none;
        }
        
        .payment-item.status-pending .payment-actions {
            display: flex;
        }
        
        /* 수정 모달 스타일 */
        .modal-content {
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .modal-header {
            background: transparent;
            color: #495057;
            border-bottom: 2px solid #e9ecef;
            border-radius: 8px 8px 0 0;
        }
        
        .modal-header .btn-close {
            filter: none;
        }
        
        .modal-body {
            padding: 2rem;
        }
        
        .modal-footer {
            border-top: 1px solid #e9ecef;
            padding: 1rem 2rem;
        }
        
        /* 수정 모달 브랜드 버튼 스타일 */
        #editPaymentModal .brand-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #e9ecef;
            background: white;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 600;
            color: #495057;
        }
        
        #editPaymentModal .brand-btn:hover {
            border-color: #4361ee;
            background: #4361ee;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.2);
        }
        
        #editPaymentModal .brand-btn.active {
            border-color: #4361ee;
            background: #4361ee;
            color: white;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(67, 97, 238, 0.25);
        }
        
        /* 모달 버튼 스타일 */
        #editPaymentModal .btn-primary {
            background: #4361ee;
            border-color: #4361ee;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            transition: all 0.3s ease;
        }
        
        #editPaymentModal .btn-primary:hover {
            background: #3f37c9;
            border-color: #3f37c9;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
        }
        
        #editPaymentModal .btn-secondary {
            background: #6c757d;
            border-color: #6c757d;
            color: white;
            font-weight: 600;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            transition: all 0.3s ease;
        }
        
        #editPaymentModal .btn-secondary:hover {
            background: #5a6268;
            border-color: #5a6268;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(108, 117, 125, 0.3);
        }
        
        /* 수정 폼 스타일 */
        #editPaymentForm .form-control,
        #editPaymentForm .form-select {
            border: 2px solid #e4e6ef;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        #editPaymentForm .form-control:focus,
        #editPaymentForm .form-select:focus {
            border-color: #495057;
            box-shadow: 0 0 0 0.2rem rgba(73, 80, 87, 0.25);
        }
        
        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .search-filters .col-6 {
                flex: 0 0 100%;
                max-width: 100%;
            }
            
            .search-filters .btn {
                width: 100%;
                margin-bottom: 0.5rem;
            }
            
            .payment-actions {
                justify-content: center;
                margin-top: 1rem;
            }
            
            .btn-edit,
            .btn-delete {
                flex: 1;
                max-width: 80px;
            }
        }
    </style>

    <div class="app-main flex-column flex-row-fluid" id="kt_app_main">
        <!--begin::Content wrapper-->
        <div class="d-flex flex-column flex-column-fluid">
            <!--begin::Toolbar-->
            <div id="kt_app_toolbar" class="app-toolbar py-3 py-lg-6">
                <!--begin::Toolbar container-->
                <div id="kt_app_toolbar_container" class="app-container container-xxl d-flex flex-stack">
                    <!--begin::Page title-->
                    <div class="page-title d-flex flex-column justify-content-center flex-wrap me-3">
                        <!--begin::Title-->
                        <h1 class="page-heading d-flex text-gray-900 fw-bold fs-3 flex-column justify-content-center my-0">배송비 입금 등록</h1>
                        <!--end::Title-->
                        <!--begin::Breadcrumb-->
                        <ul class="breadcrumb breadcrumb-separatorless fw-semibold fs-7 my-0 pt-1">
                            <!--begin::Item-->
                            <li class="breadcrumb-item text-muted">
                                <a href="/main" class="text-muted text-hover-primary">Home</a>
                            </li>
                            <!--end::Item-->
                            <!--begin::Item-->
                            <li class="breadcrumb-item">
                                <span class="bullet bg-gray-500 w-5px h-2px"></span>
                            </li>
                            <!--end::Item-->
                            <!--begin::Item-->
                            <li class="breadcrumb-item text-muted">입금 관리</li>
                            <!--end::Item-->
                            <!--begin::Item-->
                            <li class="breadcrumb-item">
                                <span class="bullet bg-gray-500 w-5px h-2px"></span>
                            </li>
                            <!--end::Item-->
                            <!--begin::Item-->
                            <li class="breadcrumb-item text-muted">배송비 입금 등록</li>
                            <!--end::Item-->
                        </ul>
                        <!--end::Breadcrumb-->
                    </div>
                    <!--end::Page title-->
                    <!--begin::Actions-->
                    <div class="d-flex align-items-center gap-2 gap-lg-3">
                        <!-- 액션 버튼들 -->
                    </div>
                    <!--end::Actions-->
                </div>
                <!--end::Toolbar container-->
            </div>
            <!--end::Toolbar-->
            <!--begin::Content-->
            <div id="kt_app_content" class="app-content flex-column-fluid">
                <!--begin::Content container-->
                <div id="kt_app_content_container" class="app-container container-fluid px-2">

                    <div class="payment-container">
                        <!-- 페이지 헤더 - 심플 버전 -->
                        <div class="simple-header mb-4">
                            <div class="d-flex justify-content-between align-items-center">
                                <h2 class="text-dark fw-bold mb-0">💳 배송비 입금 등록</h2>
                                <div class="text-end">
                                    <small class="text-muted">오늘 등록</small>
                                    <h4 class="text-primary fw-bold mb-0" id="todayCount" th:text="${todayCount != null ? todayCount + '건' : '0건'}">0건</h4>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <!-- 입금 등록 폼 -->
                            <div class="col-lg-6">
                                <div class="form-card">
                                    <div class="form-card-header">

    <script th:inline="javascript">
        // CSRF 토큰 설정
        window.csrfToken = /*[[${_csrf != null ? _csrf.token : ''}]]*/ '';
        window.csrfHeader = /*[[${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}]]*/ 'X-CSRF-TOKEN';
        
        // 전역 변수
        let currentPage = 0;
        let pageSize = 10;
        let totalPages = 0;
        let totalElements = 0;

        document.addEventListener('DOMContentLoaded', function() {
            // 현재 날짜/시간 설정
            setCurrentDateTime();
            
            // 브랜드 변경 시 기본 은행 설정
            selectBrand('RENOMA');
            
            // 폼 제출 이벤트
            document.getElementById('paymentRegisterForm').addEventListener('submit', handleFormSubmit);
            
            // 검색 필터 이벤트 설정
            setupSearchEvents();
            
            // 초기 데이터 로드
            loadPaymentList();
        });

        // 검색 이벤트 설정
        function setupSearchEvents() {
            // 엔터키로 검색
            document.getElementById('searchKeyword').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchPayments();
                }
            });
            
            // 날짜 필드 기본값 설정 (최근 1개월)
            const endDate = new Date();
            const startDate = new Date();
            startDate.setMonth(startDate.getMonth() - 1);
            
            document.getElementById('searchEndDate').value = endDate.toISOString().split('T')[0];
            document.getElementById('searchStartDate').value = startDate.toISOString().split('T')[0];
        }

        // 브랜드 선택 (입금 등록 폼 전용)
        function selectBrand(brand) {
            // 버튼 스타일 업데이트
            document.querySelectorAll('.brand-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-brand="${brand}"]`).classList.add('active');
            
            // 히든 필드 업데이트
            document.getElementById('selectedBrand').value = brand;
            
            // 기본 은행 설정
            const defaultBanks = {
                'RENOMA': '우리은행',
                'CORALIQUE': '하나은행'
            };
            
            document.getElementById('bankName').value = defaultBanks[brand] || '';
            
            // 사이트명 필터링
            filterSiteOptions(brand);
            
            // 주의: 입금내역 조회에는 영향을 주지 않음
        }

        // 브랜드에 따른 사이트명 옵션 필터링 (DB 조회)
        function filterSiteOptions(selectedBrand) {
            const siteSelect = document.getElementById('siteName');
            
            console.log('🔄 사이트 필터링 시작:', selectedBrand);
            console.log('📋 현재 사이트 셀렉트 요소:', siteSelect);
            
            if (!siteSelect) {
                console.error('❌ 사이트 셀렉트 요소를 찾을 수 없습니다');
                return;
            }
            
            // 기존 옵션 모두 제거 (첫 번째 "선택하세요" 제외)
            while (siteSelect.children.length > 1) {
                siteSelect.removeChild(siteSelect.lastChild);
            }
            console.log('🗑️ 기존 옵션 제거 완료');
            
            // 로딩 옵션 추가
            const loadingOption = document.createElement('option');
            loadingOption.value = '';
            loadingOption.textContent = '로딩 중...';
            loadingOption.disabled = true;
            siteSelect.appendChild(loadingOption);
            console.log('⏳ 로딩 옵션 추가 완료');
            
            // DB에서 브랜드별 사이트 목록 조회
            fetch(`/payment/api/sites?brand=${selectedBrand}`)
                .then(response => {
                    console.log('🌐 API 응답 상태:', response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('📊 사이트 목록 조회 응답:', data);
                    
                    // 로딩 옵션 제거
                    if (siteSelect.contains(loadingOption)) {
                        siteSelect.removeChild(loadingOption);
                        console.log('⏳ 로딩 옵션 제거 완료');
                    }
                    
                    if (data.success && data.data && Array.isArray(data.data)) {
                        console.log('✅ API 성공, 사이트 데이터:', data.data);
                        
                        // 조회된 사이트들을 옵션으로 추가
                        data.data.forEach((site, index) => {
                            console.log(`🏪 사이트 ${index + 1}:`, site);
                            
                            const option = document.createElement('option');
                            option.value = site.siteName || site.SITENAME || '';
                            option.textContent = site.siteName || site.SITENAME || '사이트명 없음';
                            siteSelect.appendChild(option);
                            
                            console.log(`➕ 옵션 추가: ${option.textContent}`);
                        });
                        
                        console.log(`🎉 ${selectedBrand} 브랜드 사이트 ${data.count}개 로드 완료`);
                        console.log('📋 최종 셀렉트 옵션 개수:', siteSelect.children.length);
                        
                        // 옵션이 실제로 추가되었는지 확인
                        for (let i = 0; i < siteSelect.children.length; i++) {
                            console.log(`옵션 ${i}: ${siteSelect.children[i].textContent}`);
                        }
                        
                    } else {
                        console.error('❌ 사이트 목록 조회 실패:', data.message || '데이터 없음');
                        console.log('🔍 전체 응답 데이터:', JSON.stringify(data, null, 2));
                        showErrorMessage('사이트 목록을 불러오는데 실패했습니다.');
                    }
                })
                .catch(error => {
                    console.error('🚨 사이트 목록 조회 오류:', error);
                    
                    // 로딩 옵션 제거
                    if (siteSelect.contains(loadingOption)) {
                        siteSelect.removeChild(loadingOption);
                    }
                    
                    // 오류 옵션 추가
                    const errorOption = document.createElement('option');
                    errorOption.value = '';
                    errorOption.textContent = '사이트 목록 로드 실패';
                    errorOption.disabled = true;
                    siteSelect.appendChild(errorOption);
                    
                    showErrorMessage('사이트 목록을 불러오는 중 오류가 발생했습니다.');
                });
            
            // 사이트명 선택 초기화
            siteSelect.value = '';
        }

        // 현재 날짜/시간 설정
        function setCurrentDateTime() {
            const now = new Date();
            const date = now.toISOString().split('T')[0];
            const time = now.toTimeString().slice(0, 5);
            
            document.querySelector('input[name="paymentDate"]').value = date;
            document.querySelector('input[name="paymentTime"]').value = time;
        }

        // 폼 제출 처리
        function handleFormSubmit(event) {
            event.preventDefault();
            
            // 로딩 표시
            const submitBtn = document.querySelector('.btn-register');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="spinner-border spinner-border-sm me-2"></i>등록 중...';
            submitBtn.disabled = true;
            
            // 폼 데이터 수집
            const formData = new FormData(event.target);
            
            // 날짜와 시간을 합쳐서 timestamp로 변환
            const paymentDate = formData.get('paymentDate');
            const paymentTime = formData.get('paymentTime');
            const paymentDateTime = `${paymentDate}T${paymentTime}:00`;
            
            // 서버로 전송할 데이터 준비
            const submitData = {
                brand: formData.get('brand'),
                siteName: formData.get('siteName'),
                bankName: formData.get('bankName'),
                customerName: formData.get('customerName'),
                amount: parseInt(formData.get('amount')),
                paymentDate: paymentDateTime,
                notes: formData.get('notes') || ''
            };
            
            console.log('제출 데이터:', submitData);
            
            // API 호출
            fetch('/payment/api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [window.csrfHeader]: window.csrfToken
                },
                body: JSON.stringify(submitData)
            })
            .then(response => response.json())
            .then(data => {
                console.log('서버 응답:', data);
                
                if (data.success) {
                    // 성공 메시지
                    showSuccessMessage('입금 정보가 성공적으로 등록되었습니다.');
                    
                    // 폼 초기화
                    resetForm();
                    
                    // 최근 입금 내역 새로고침
                    refreshRecentPayments();
                    
                    // 오늘 카운트 업데이트
                    updateTodayCount();
                } else {
                    showErrorMessage(data.message || '등록 중 오류가 발생했습니다.');
                }
            })
            .catch(error => {
                console.error('등록 오류:', error);
                showErrorMessage('등록 중 오류가 발생했습니다. 다시 시도해주세요.');
            })
            .finally(() => {
                // 버튼 복원
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            });
        }

        // 폼 초기화
        function resetForm() {
            document.getElementById('paymentRegisterForm').reset();
            setCurrentDateTime();
            selectBrand('RENOMA');
        }

        // 성공 메시지 표시
        function showSuccessMessage(message) {
            showToast(message, 'success', 'ki-check-circle');
        }
        
        // 오류 메시지 표시
        function showErrorMessage(message) {
            showToast(message, 'error', 'ki-cross-circle');
        }
        
        // 토스트 메시지 표시 공통 함수
        function showToast(message, type, icon) {
            const toastColor = type === 'success' ? '#28a745' : '#dc3545';
            const toastBg = type === 'success' ? 'linear-gradient(135deg, #28a745, #20c997)' : 'linear-gradient(135deg, #dc3545, #c82333)';
            
            const alertHtml = `
                <div class="alert alert-${type === 'success' ? 'success' : 'danger'} alert-dismissible fade show position-fixed" 
                     style="top: 20px; right: 20px; z-index: 9999; min-width: 300px; background: ${toastBg}; border: none; color: white;">
                    <i class="ki-duotone ${icon} fs-2 me-2"></i>
                    ${message}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', alertHtml);
            
            // 5초 후 자동 제거
            setTimeout(() => {
                const alert = document.querySelector('.alert:last-child');
                if (alert) {
                    alert.remove();
                }
            }, 5000);
        }
        
        // 검색 실행
        function searchPayments() {
            currentPage = 0; // 검색 시 첫 페이지로 이동
            loadPaymentList();
        }

        // 검색 초기화
        function resetSearch() {
            document.getElementById('searchKeyword').value = '';
            document.getElementById('searchBrand').value = '';
            document.getElementById('searchStatus').value = '';
            
            // 날짜 필드 초기화 (최근 1개월)
            const endDate = new Date();
            const startDate = new Date();
            startDate.setMonth(startDate.getMonth() - 1);
            
            document.getElementById('searchEndDate').value = endDate.toISOString().split('T')[0];
            document.getElementById('searchStartDate').value = startDate.toISOString().split('T')[0];
            
            currentPage = 0;
            loadPaymentList();
        }

        // 입금 내역 목록 로드
        function loadPaymentList() {
            const spinner = document.getElementById('loadingSpinner');
            const paymentList = document.getElementById('paymentList');
            
            if (spinner) {
                spinner.style.display = 'block';
            }

            // 검색 파라미터 수집
            const searchParams = {
                page: currentPage,
                size: pageSize,
                keyword: document.getElementById('searchKeyword').value.trim(),
                startDate: document.getElementById('searchStartDate').value,
                endDate: document.getElementById('searchEndDate').value
            };

            // 브랜드 필터
            const brand = document.getElementById('searchBrand').value;
            if (brand) {
                searchParams.brand = brand;
            }

            // 상태 필터
            const status = document.getElementById('searchStatus').value;
            if (status) {
                searchParams.mappingStatus = status;
            }

            console.log('검색 파라미터:', searchParams);

            // URL 파라미터 생성
            const urlParams = new URLSearchParams();
            Object.keys(searchParams).forEach(key => {
                if (searchParams[key] !== '' && searchParams[key] !== null && searchParams[key] !== undefined) {
                    urlParams.append(key, searchParams[key]);
                }
            });

            fetch(`/payment/api/list?${urlParams.toString()}`)
                .then(response => {
                    console.log('HTTP 응답 상태:', response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('전체 API 응답:', data);
                    console.log('success 값:', data.success);
                    console.log('content 데이터:', data.content);
                    console.log('totalElements 값:', data.totalElements);
                    
                    if (data.success) {
                        // 페이징 정보 업데이트
                        totalElements = data.totalElements || 0;
                        totalPages = data.totalPages || 0;
                        
                        console.log('설정된 totalElements:', totalElements);
                        console.log('설정된 totalPages:', totalPages);
                        
                        // 리스트 업데이트
                        const contentData = data.content || [];
                        console.log('업데이트할 컨텐츠:', contentData);
                        updatePaymentList(contentData);
                        
                        // 통계 정보 업데이트
                        updateSearchStats();
                        
                        // 페이징 UI 업데이트
                        updatePagination();
                    } else {
                        console.error('API 실패:', data.message);
                        showErrorMessage(data.message || '입금 내역 조회에 실패했습니다.');
                        updatePaymentList([]);
                    }
                })
                .catch(error => {
                    console.error('입금 내역 로드 오류:', error);
                    showErrorMessage('입금 내역을 불러오는 중 오류가 발생했습니다.');
                    updatePaymentList([]);
                })
                .finally(() => {
                    if (spinner) {
                        spinner.style.display = 'none';
                    }
                });
        }

        // 최근 입금 내역 새로고침 (기존 함수명 유지, 새 구현)
        function refreshRecentPayments() {
            loadPaymentList();
        }
        
        // 입금 내역 리스트 업데이트
        function updatePaymentList(payments) {
            console.log('updatePaymentList 호출됨. payments:', payments);
            console.log('payments 타입:', typeof payments);
            console.log('payments 길이:', payments ? payments.length : 'undefined');
            
            const listContainer = document.getElementById('paymentList');
            
            if (!payments || payments.length === 0) {
                console.log('빈 상태 처리');
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="ki-duotone ki-information-2"></i>
                        <p>검색 조건에 맞는 입금 내역이 없습니다.</p>
                    </div>
                `;
                return;
            }
            
            const itemsHtml = payments.map(payment => {
                // Oracle Map 키는 대문자로 반환됨
                const customerName = payment.CUSTOMERNAME || payment.customerName || '';
                const bankName = payment.BANKNAME || payment.bankName || '';
                const siteName = payment.SITENAME || payment.siteName || '';
                const brand = payment.BRAND || payment.brand || '';
                const amount = payment.AMOUNT || payment.amount || 0;
                const mappingStatus = payment.MAPPINGSTATUS || payment.mappingStatus || 'PENDING';
                const registerDate = payment.REGISTERDATE || payment.registerDate || '';
                const paymentDate = payment.PAYMENTDATE || payment.paymentDate || '';
                const registerId = payment.REGISTERID || payment.registerId || '';
                const notes = payment.NOTES || payment.notes || '';
                
                // 입금 시간 추출 (PAYMENT_DATE에서)
                let paymentTimeStr = '';
                if (paymentDate && typeof paymentDate === 'string' && paymentDate.length >= 16) {
                    paymentTimeStr = paymentDate.substring(11, 16); // HH:mm 추출
                } else if (paymentDate) {
                    try {
                        paymentTimeStr = new Date(paymentDate).toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit'});
                    } catch (e) {
                        paymentTimeStr = '';
                    }
                }
                
                // 입금 날짜 추출 (PAYMENT_DATE에서)
                let paymentDateStr = '';
                if (paymentDate && typeof paymentDate === 'string' && paymentDate.length >= 10) {
                    paymentDateStr = paymentDate.substring(0, 10); // YYYY-MM-DD 추출
                } else if (paymentDate) {
                    try {
                        paymentDateStr = new Date(paymentDate).toLocaleDateString('ko-KR');
                    } catch (e) {
                        paymentDateStr = '';
                    }
                }
                
                // 브랜드 표시명 변환
                const brandDisplayName = brand === 'RENOMA' ? '레노마' : brand === 'CORALIQUE' ? '코랄리크' : brand;
                const brandClass = brand.toLowerCase() === 'renoma' ? 'renoma' : 'coralique';
                
                return `
                    <div class="payment-item status-${mappingStatus.toLowerCase()}" data-id="${registerId}">
                        <div class="payment-info">
                            <div class="payment-brand-customer">
                                <span class="brand-badge ${brandClass}">${brandDisplayName}</span>
                                <span class="customer-name">${customerName}</span>
                            </div>
                            <div class="payment-details">
                                <div class="payment-bank-time">
                                    <i class="ki-duotone ki-bank fs-6 me-1"></i>
                                    ${bankName} • ${paymentTimeStr}
                                </div>
                                <div class="payment-date">
                                    <i class="ki-duotone ki-calendar fs-6 me-1"></i>
                                    ${paymentDateStr}
                                </div>
                                ${siteName ? `<div class="payment-site"><i class="ki-duotone ki-shop fs-6 me-1"></i>${siteName}</div>` : ''}
                                ${notes ? `<div class="payment-notes"><i class="ki-duotone ki-notepad fs-6 me-1"></i>${notes}</div>` : ''}
                                ${mappingStatus === 'PENDING' ? `
                                    <div class="payment-actions">
                                        <button type="button" class="btn-edit" onclick="editPayment(${registerId})" title="수정">
                                            <i class="ki-duotone ki-pencil fs-6 me-1"></i>수정
                                        </button>
                                        <button type="button" class="btn-delete" onclick="deletePayment(${registerId})" title="삭제">
                                            <i class="ki-duotone ki-trash fs-6 me-1"></i>삭제
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                        <div>
                            <div class="payment-amount">${Number(amount).toLocaleString()}원</div>
                            <div class="payment-status ${mappingStatus === 'PENDING' ? 'status-pending' : 'status-mapped'}">
                                ${mappingStatus === 'PENDING' ? '미매핑' : '매핑완료'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            listContainer.innerHTML = itemsHtml;
        }

        // 검색 통계 정보 업데이트
        function updateSearchStats() {
            const totalCountEl = document.getElementById('totalCount');
            const currentRangeEl = document.getElementById('currentRange');
            
            const startIndex = (currentPage * pageSize) + 1;
            const endIndex = Math.min((currentPage + 1) * pageSize, totalElements);
            
            totalCountEl.textContent = totalElements.toLocaleString();
            currentRangeEl.textContent = totalElements > 0 ? `${startIndex}-${endIndex}` : '0';
        }

        // 페이징 UI 업데이트
        function updatePagination() {
            const paginationList = document.getElementById('paginationList');
            
            if (totalPages <= 1) {
                paginationList.innerHTML = '';
                return;
            }
            
            let paginationHtml = '';
            
            // 이전 버튼
            paginationHtml += `
                <li class="page-item ${currentPage === 0 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="goToPage(${currentPage - 1})" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
            `;
            
            // 페이지 번호들
            const startPage = Math.max(0, currentPage - 2);
            const endPage = Math.min(totalPages - 1, currentPage + 2);
            
            if (startPage > 0) {
                paginationHtml += `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(0)">1</a></li>`;
                if (startPage > 1) {
                    paginationHtml += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }
            
            for (let i = startPage; i <= endPage; i++) {
                paginationHtml += `
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="goToPage(${i})">${i + 1}</a>
                    </li>
                `;
            }
            
            if (endPage < totalPages - 1) {
                if (endPage < totalPages - 2) {
                    paginationHtml += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
                paginationHtml += `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${totalPages - 1})">${totalPages}</a></li>`;
            }
            
            // 다음 버튼
            paginationHtml += `
                <li class="page-item ${currentPage === totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="goToPage(${currentPage + 1})" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            `;
            
            paginationList.innerHTML = paginationHtml;
        }

        // 페이지 이동
        function goToPage(page) {
            if (page < 0 || page >= totalPages || page === currentPage) {
                return;
            }
            
            currentPage = page;
            loadPaymentList();
        }

        // 최근 입금 내역 UI 업데이트 (기존 함수명 유지, 새 구현으로 리다이렉트)
        function updateRecentPaymentsList(payments) {
            updatePaymentList(payments);
        }
        
        // 오늘 카운트 업데이트
        function updateTodayCount() {
            fetch('/payment/api/today-count')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const countElement = document.getElementById('todayCount');
                        if (countElement) {
                            countElement.textContent = `${data.count}건`;
                        }
                    }
                })
                .catch(error => {
                    console.error('오늘 카운트 업데이트 오류:', error);
                });
        }

        // 수정 모달에서 브랜드 선택
        function selectEditBrand(brand, currentSiteName = null) {
            console.log('🔧 수정 모달 브랜드 선택:', brand, '기존 사이트:', currentSiteName);
            
            // 버튼 스타일 업데이트
            document.querySelectorAll('#editPaymentModal .brand-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`#editPaymentModal [data-brand="${brand}"]`).classList.add('active');
            
            // 히든 필드 업데이트
            document.getElementById('editSelectedBrand').value = brand;
            
            // 기본 은행 설정
            const defaultBanks = {
                'RENOMA': '우리은행',
                'CORALIQUE': '하나은행'
            };
            
            document.getElementById('editBankName').value = defaultBanks[brand] || '';
            
            // 사이트명 필터링 (기존 사이트명을 전달)
            filterEditSiteOptions(brand, currentSiteName);
        }

        // 수정 모달에서 브랜드에 따른 사이트명 옵션 필터링 (DB 조회)
        function filterEditSiteOptions(selectedBrand, currentSiteName = null) {
            const siteSelect = document.getElementById('editSiteName');
            
            console.log('🔄 수정 모달 사이트 필터링 시작:', selectedBrand, '기존 사이트:', currentSiteName);
            console.log('📋 수정 모달 사이트 셀렉트 요소:', siteSelect);
            
            if (!siteSelect) {
                console.error('❌ 수정 모달 사이트 셀렉트 요소를 찾을 수 없습니다');
                return;
            }
            
            // 기존 옵션 모두 제거 (첫 번째 "선택하세요" 제외)
            while (siteSelect.children.length > 1) {
                siteSelect.removeChild(siteSelect.lastChild);
            }
            console.log('🗑️ 수정 모달 기존 옵션 제거 완료');
            
            // 로딩 옵션 추가
            const loadingOption = document.createElement('option');
            loadingOption.value = '';
            loadingOption.textContent = '로딩 중...';
            loadingOption.disabled = true;
            siteSelect.appendChild(loadingOption);
            console.log('⏳ 수정 모달 로딩 옵션 추가 완료');
            
            // DB에서 브랜드별 사이트 목록 조회
            fetch(`/payment/api/sites?brand=${selectedBrand}`)
                .then(response => {
                    console.log('🌐 수정 모달 API 응답 상태:', response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('📊 수정 모달 사이트 목록 조회 응답:', data);
                    
                    // 로딩 옵션 제거
                    if (siteSelect.contains(loadingOption)) {
                        siteSelect.removeChild(loadingOption);
                        console.log('⏳ 수정 모달 로딩 옵션 제거 완료');
                    }
                    
                    if (data.success && data.data && Array.isArray(data.data)) {
                        console.log('✅ 수정 모달 API 성공, 사이트 데이터:', data.data);
                        
                        // 조회된 사이트들을 옵션으로 추가
                        data.data.forEach((site, index) => {
                            console.log(`🏪 수정 모달 사이트 ${index + 1}:`, site);
                            
                            const option = document.createElement('option');
                            option.value = site.siteName || site.SITENAME || '';
                            option.textContent = site.siteName || site.SITENAME || '사이트명 없음';
                            siteSelect.appendChild(option);
                            
                            console.log(`➕ 수정 모달 옵션 추가: ${option.textContent}`);
                        });
                        
                        console.log(`🎉 수정 모달: ${selectedBrand} 브랜드 사이트 ${data.count}개 로드 완료`);
                        console.log('📋 수정 모달 최종 셀렉트 옵션 개수:', siteSelect.children.length);
                        
                        // 기존 사이트명이 있으면 선택
                        if (currentSiteName) {
                            console.log('🎯 기존 사이트명 설정 시도:', currentSiteName);
                            siteSelect.value = currentSiteName;
                            console.log('🎯 설정 후 현재 값:', siteSelect.value);
                            
                            // 값이 제대로 설정되지 않았다면 다시 시도
                            if (siteSelect.value !== currentSiteName) {
                                console.warn('⚠️ 사이트명 자동 선택 실패, 옵션 목록 확인:');
                                for (let i = 0; i < siteSelect.children.length; i++) {
                                    console.log(`  옵션 ${i}: "${siteSelect.children[i].value}" - "${siteSelect.children[i].textContent}"`);
                                }
                            } else {
                                console.log('✅ 기존 사이트명 설정 성공!');
                            }
                        }
                        
                    } else {
                        console.error('❌ 수정 모달 사이트 목록 조회 실패:', data.message || '데이터 없음');
                        console.log('🔍 수정 모달 전체 응답 데이터:', JSON.stringify(data, null, 2));
                        showErrorMessage('사이트 목록을 불러오는데 실패했습니다.');
                    }
                })
                .catch(error => {
                    console.error('🚨 수정 모달 사이트 목록 조회 오류:', error);
                    
                    // 로딩 옵션 제거
                    if (siteSelect.contains(loadingOption)) {
                        siteSelect.removeChild(loadingOption);
                    }
                    
                    // 오류 옵션 추가
                    const errorOption = document.createElement('option');
                    errorOption.value = '';
                    errorOption.textContent = '사이트 목록 로드 실패';
                    errorOption.disabled = true;
                    siteSelect.appendChild(errorOption);
                    
                    showErrorMessage('사이트 목록을 불러오는 중 오류가 발생했습니다.');
                });
        }

        // 입금 내역 수정
        function editPayment(id) {
            // 기존 데이터 로드
            fetch(`/payment/api/${id}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const payment = data.data;
                        
                        // 매핑 상태 재확인
                        if (payment.mappingStatus === 'MAPPED') {
                            showErrorMessage('매핑이 완료된 입금 내역은 수정할 수 없습니다.');
                            return;
                        }
                        
                        // 폼에 데이터 설정
                        document.getElementById('editRegisterId').value = payment.registerId;
                        
                        console.log('💾 수정 모달 데이터 로드:', payment);
                        
                        // 브랜드 선택 (기존 사이트명을 함께 전달)
                        selectEditBrand(payment.brand, payment.siteName);
                        
                        // 기타 필드 설정 (사이트명은 selectEditBrand에서 처리)
                        document.getElementById('editBankName').value = payment.bankName || '';
                        document.getElementById('editCustomerName').value = payment.customerName || '';
                        document.getElementById('editAmount').value = payment.amount || '';
                        document.getElementById('editNotes').value = payment.notes || '';
                        
                        // 날짜/시간 설정
                        if (payment.paymentDate) {
                            const paymentDate = new Date(payment.paymentDate);
                            const dateStr = paymentDate.toISOString().split('T')[0];
                            const timeStr = paymentDate.toTimeString().slice(0, 5);
                            
                            document.getElementById('editPaymentDate').value = dateStr;
                            document.getElementById('editPaymentTime').value = timeStr;
                        }
                        
                        // 모달 표시
                        const modal = new bootstrap.Modal(document.getElementById('editPaymentModal'));
                        modal.show();
                    } else {
                        showErrorMessage(data.message || '입금 내역을 불러올 수 없습니다.');
                    }
                })
                .catch(error => {
                    console.error('입금 내역 조회 오류:', error);
                    showErrorMessage('입금 내역을 불러오는 중 오류가 발생했습니다.');
                });
        }

        // 수정 내용 저장
        function savePaymentEdit() {
            const form = document.getElementById('editPaymentForm');
            const formData = new FormData(form);
            
            // 날짜와 시간을 합쳐서 timestamp로 변환
            const paymentDate = formData.get('paymentDate');
            const paymentTime = formData.get('paymentTime');
            const paymentDateTime = `${paymentDate}T${paymentTime}:00`;
            
            // 서버로 전송할 데이터 준비
            const updateData = {
                brand: formData.get('brand'),
                siteName: formData.get('siteName'),
                bankName: formData.get('bankName'),
                customerName: formData.get('customerName'),
                amount: parseInt(formData.get('amount')),
                paymentDate: paymentDateTime,
                notes: formData.get('notes') || ''
            };
            
            const registerId = document.getElementById('editRegisterId').value;
            
            // 저장 버튼 로딩 상태
            const saveBtn = document.querySelector('#editPaymentModal .btn-primary');
            const originalText = saveBtn.innerHTML;
            saveBtn.innerHTML = '<i class="spinner-border spinner-border-sm me-2"></i>저장 중...';
            saveBtn.disabled = true;
            
            // API 호출
            fetch(`/payment/api/${registerId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    [window.csrfHeader]: window.csrfToken
                },
                body: JSON.stringify(updateData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showSuccessMessage('입금 내역이 성공적으로 수정되었습니다.');
                    
                    // 모달 닫기
                    const modal = bootstrap.Modal.getInstance(document.getElementById('editPaymentModal'));
                    modal.hide();
                    
                    // 목록 새로고침
                    loadPaymentList();
                    
                    // 오늘 카운트 업데이트
                    updateTodayCount();
                } else {
                    showErrorMessage(data.message || '수정 중 오류가 발생했습니다.');
                }
            })
            .catch(error => {
                console.error('수정 오류:', error);
                showErrorMessage('수정 중 오류가 발생했습니다. 다시 시도해주세요.');
            })
            .finally(() => {
                // 버튼 복원
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
            });
        }

        // 입금 내역 삭제
        function deletePayment(id) {
            // 삭제 확인
            if (!confirm('정말로 이 입금 내역을 삭제하시겠습니까?\n삭제된 내역은 복구할 수 없습니다.')) {
                return;
            }
            
            // API 호출
            fetch(`/payment/api/${id}`, {
                method: 'DELETE',
                headers: {
                    [window.csrfHeader]: window.csrfToken
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showSuccessMessage('입금 내역이 성공적으로 삭제되었습니다.');
                    
                    // 목록 새로고침
                    loadPaymentList();
                    
                    // 오늘 카운트 업데이트
                    updateTodayCount();
                } else {
                    showErrorMessage(data.message || '삭제 중 오류가 발생했습니다.');
                }
            })
            .catch(error => {
                console.error('삭제 오류:', error);
                showErrorMessage('삭제 중 오류가 발생했습니다. 다시 시도해주세요.');
            });
        }
    </script>
