#########################
# WICRM 개발(로컬) 환경 설정
# 실행: --spring.profiles.active=dev (기본값)
#########################

#########################
# 데이터베이스 (환경변수 우선, 없으면 기본값 사용)
#########################
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@211.110.44.40:1521:o?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:twowincall}
spring.datasource.password=${DB_PASSWORD:twowincall}

#########################
# 서버 설정 (HTTP)
#########################
server.port=8081
server.ssl.enabled=false
security.require-ssl=false

#########################
# Thymeleaf 캐시
#########################
spring.thymeleaf.cache=false

#########################
# 세션 타임아웃
#########################
server.servlet.session.timeout=120m

#########################
# 파일 서버 설정
#########################
file.upload-dir=uploads
app.file-server.url=http://localhost:8080
app.file-server.upload-path=/uploads/
remote.upload.method=local

#########################
# 로깅 설정
#########################
logging.level.root=INFO
logging.level.com.wio.crm=DEBUG
logging.file.name=logs/wicrm-local.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# SQL 디버깅 로그
logging.level.com.wio.crm.mapper=DEBUG
logging.level.org.springframework.jdbc=DEBUG

#########################
# 개발 편의 기능
#########################
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

#########################
# Cafe24 OAuth (개발용 — 환경변수 미설정 시 빈 값. 인증 시도하면 정상적으로 not_configured로 안내됨)
# 운영 등록값: https://wioservice.kr/integrations/cafe24/oauth/callback
#########################
cafe24.client-id=${WIO_CAFE24_CLIENT_ID:}
cafe24.client-secret=${WIO_CAFE24_CLIENT_SECRET:}
cafe24.redirect-uri=${WIO_CAFE24_REDIRECT_URI:http://localhost:8081/integrations/cafe24/oauth/callback}
cafe24.scope=${WIO_CAFE24_SCOPE:mall.read_customer,mall.read_order,mall.write_order,mall.read_personal}
cafe24.fallback-scope=${WIO_CAFE24_FALLBACK_SCOPE:mall.read_customer,mall.read_order,mall.write_order}
