spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#########################
# 세션 타임아웃
#########################
# 🔧 로컬 개발용 - 세션 연장
server.servlet.session.timeout=120m

# 🚀 운영 서버용 - 주석처리
# server.servlet.session.timeout=60m

#########################
# MyBatis
#########################
mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=mapper/*.xml
mybatis.type-handlers-package=com.wio.crm.config

#########################
# JPA
#########################
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

#########################
# HikariCP
#########################
spring.datasource.hikari.leakDetectionThreshold=30000
spring.datasource.hikari.connectionInitSql=SELECT 1 FROM DUAL
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

#########################
# 로깅 설정
#########################
# 🔧 로컬 개발용 로깅
logging.level.root=INFO
logging.level.com.wio.crm=DEBUG
logging.file.name=logs/wicrm-local.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 🔧 개발용 SQL 디버깅 로그
logging.level.com.wio.crm.mapper=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# 🚀 운영 서버용 로깅 (주석처리)
# logging.level.root=INFO
# logging.level.com.wio.crm=INFO
# logging.file.name=logs/wicrm.log
# logging.level.com.wio.crm.mapper.AccountMapper=TRACE
# logging.level.org.apache.ibatis=TRACE
# logging.level.org.apache.ibatis.logging.jdbc=TRACE

#########################
# 개발용 추가 설정
#########################
# Spring Boot 배너 활성화
spring.main.banner-mode=console
spring.output.ansi.enabled=ALWAYS

# 🔧 개발 편의 기능
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
