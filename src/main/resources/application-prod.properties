#########################
# WICRM 운영 환경 설정
# 실행: --spring.profiles.active=prod
#########################
# ⚠️ 운영 배포 시 아래 환경변수를 반드시 설정하세요:
#   DB_URL, DB_USERNAME, DB_PASSWORD
#   SSL_KEYSTORE_PASSWORD
#   FILE_SERVER_URL
#   OPENAI_API_KEY (AI 리포트 사용 시)

#########################
# 데이터베이스 (환경변수 필수)
#########################
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@211.110.44.40:1521:o?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#########################
# 서버 설정 (HTTPS)
#########################
server.port=443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=wioservice
security.require-ssl=true

# 프록시/SSL 헤더 설정
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.tomcat.protocol-header-https-value=https
server.forward-headers-strategy=NATIVE

#########################
# Thymeleaf 캐시
#########################
spring.thymeleaf.cache=true

#########################
# 세션 타임아웃
#########################
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=Lax

#########################
# 파일 서버 설정
#########################
file.upload-dir=uploads
app.file-server.url=${FILE_SERVER_URL:http://175.119.224.45:8080}
app.file-server.upload-path=/uploads/
remote.upload.method=http
remote.upload.api-url=${FILE_SERVER_URL:http://175.119.224.45:8080}/api/upload

# FTP 설정 (필요 시)
# remote.upload.method=ftp
# remote.ftp.host=175.119.224.45
# remote.ftp.port=21
# remote.ftp.username=${FTP_USERNAME}
# remote.ftp.password=${FTP_PASSWORD}
