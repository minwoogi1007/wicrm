# remote.upload.method=sftp
# remote.sftp.host=175.119.224.45
# remote.sftp.port=22
# remote.sftp.username=${SFTP_USERNAME}
# remote.sftp.password=${SFTP_PASSWORD}
# remote.sftp.remote-path=/uploads/images/

#########################
# 로깅 설정
#########################
logging.level.root=INFO
logging.level.com.wio.crm=INFO
logging.file.name=logs/wicrm.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

#########################
# 개발 도구 비활성화
#########################
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

#########################
# Cafe24 OAuth (운영 — client-secret은 평문 properties 금지, 환경변수만)
# 카페24 개발자센터 등록 값:
#   서비스 URL    = https://wioservice.kr
#   Redirect URI  = https://wioservice.kr/integrations/cafe24/oauth/callback
#   Scope         = mall.read_customer,mall.read_order,mall.write_order,mall.read_personal
#########################
cafe24.client-id=${WIO_CAFE24_CLIENT_ID:}
cafe24.client-secret=${WIO_CAFE24_CLIENT_SECRET:}
cafe24.redirect-uri=${WIO_CAFE24_REDIRECT_URI:https://wioservice.kr/integrations/cafe24/oauth/callback}
cafe24.scope=${WIO_CAFE24_SCOPE:mall.read_customer,mall.read_order,mall.write_order,mall.read_personal}
cafe24.fallback-scope=${WIO_CAFE24_FALLBACK_SCOPE:mall.read_customer,mall.read_order,mall.write_order}
